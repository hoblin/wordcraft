name: Release

on:
  push:
    tags: ["v*-bondata.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0
          path: craft-fonts
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libasound2-dev pkg-config desktop-file-utils appstream
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build and package
        run: |
          cargo xtask version set "${GITHUB_REF_NAME#v}"
          packaging/linux/package.sh --formats tar
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist/release
          sha256sum -- * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --title "WordCraft $GITHUB_REF_NAME" --generate-notes -- *
